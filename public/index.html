<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sony Remote</title>
<style>
  :root {
    --bg: #F0F0F0;
    --panel: #FFFFFF;
    --ring: #E2E2E2;
    --key: #FFFFFF;
    --line: #CFCFCF;
    --text: #212121;
    --muted: #5F6368;
    --accent: #1A56DB;
    --brand: #D93C2F;
    --power: #C0332A;
    --ok: #1B7F3B;
    --warn: #8A5A00;
    --err: #B3261E;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  svg {
    width: 24px; height: 24px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .remote {
    width: 100%; flex: 1;
    max-width: 390px;
    margin: 0 auto;
    padding: 16px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .appbar {
    position: sticky; top: 0; z-index: 1;
    background: var(--brand); color: #fff;
    padding: 16px 20px;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .25);
  }
  .appbar .inner {
    max-width: 390px; margin: 0 auto;
    display: flex; align-items: center; gap: 14px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 500; }
  .iconbtn {
    margin-left: auto; width: 44px; height: 44px; flex: none;
    border: 0; border-radius: 50%; background: transparent; color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .iconbtn:active { background: rgba(255, 255, 255, .2); }
  .iconbtn.dark { color: var(--text); margin-left: 0; }
  .iconbtn.dark:active { background: var(--ring); }
  .appbar .iconbtn:focus-visible { outline-color: #fff; }

  .sheet {
    width: min(100%, 390px); max-width: 100%; max-height: 92vh;
    margin: auto auto 0; padding: 0; border: 0;
    border-radius: 20px 20px 0 0;
    background: var(--panel); color: var(--text);
    overflow: auto;
  }
  .sheet::backdrop { background: rgba(0, 0, 0, .5); }
  .sheet-body { padding: 8px 16px 32px 20px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h2 { margin: 0; font-size: 18px; }
  .log-title { margin: 24px 0 8px; }
  .status {
    margin: 0;
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 13px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status[data-tone="ok"] .dot { background: var(--ok); }
  .status[data-tone="warn"] .dot { background: var(--warn); }
  .status[data-tone="error"] .dot { background: var(--err); }

  .key {
    min-height: 56px;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: var(--key);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 600; font-size: 14px;
    user-select: none; -webkit-user-select: none;
  }
  .key:active { filter: brightness(.9); }

  .tab { display: flex; flex-direction: column; gap: 14px; }
  .tab[hidden] { display: none; }
  .key.sm {
    min-height: 48px; border-radius: 24px; padding: 0 6px;
    font-size: 13px; line-height: 1.15; text-align: center;
  }
  .key.accent { background: var(--accent); color: #fff; border-color: transparent; }
  .key.power { background: var(--power); color: #fff; border-color: transparent; }
  .row4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .row5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .stage {
    display: grid; grid-template-columns: minmax(0, 60px) 1fr minmax(0, 60px);
    gap: 8px; align-items: stretch;
  }
  .side { display: flex; flex-direction: column; justify-content: space-between; }
  .audio { display: grid; grid-template-columns: 1fr 2fr 2fr; gap: 8px; }
  .grp { display: flex; flex-direction: column; gap: 4px; }
  .grp .key { flex: 1; }
  .lbl {
    text-align: center; font-size: 12px; font-weight: 600;
    letter-spacing: .08em; color: var(--muted);
  }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; flex: 1; }
  .numpad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .numpad .key { min-height: 56px; font-size: 20px; }
  .numpad .key.sm { font-size: 13px; }
  .colors .key { border-color: transparent; }
  .c-red { background: #C0332A; }
  .c-green { background: #1B7F3B; }
  .c-yellow { background: #F2C200; }
  .c-blue { background: #1A56DB; }

  .tabs {
    position: sticky; bottom: 0; z-index: 1;
    width: 100%; max-width: 390px; margin: 0 auto; display: flex;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .tabs button {
    flex: 1; min-height: 56px; border: 0; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs button[aria-selected="true"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }

  .dpad {
    justify-self: center;
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 6px; padding: 6px;
    background: var(--ring);
    border-radius: 999px;
  }
  .dpad .key { width: 52px; min-height: 52px; border-radius: 50%; padding: 0; }
  .dpad .up { grid-area: 1 / 2; }
  .dpad .left { grid-area: 2 / 1; }
  .dpad .ok { grid-area: 2 / 2; background: #2B2F38; color: #fff; border-color: transparent; font-size: 15px; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down { grid-area: 3 / 2; }


  .panel { background: var(--panel); border-radius: 16px; padding: 16px; }
  summary { font-weight: 600; cursor: pointer; }
  .fields { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; margin-top: 14px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input {
    width: 100%; min-width: 0;
    min-height: 44px; padding: 0 12px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    font-size: 16px; color: var(--text);
  }
  .btn {
    min-height: 44px; padding: 0 14px; margin-top: 14px;
    background: transparent; border: 1px solid var(--line); border-radius: 10px;
    font-weight: 600; font-size: 14px;
  }
  .hint { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
  pre {
    margin: 12px 0 0; padding: 12px; max-height: 280px; overflow: auto;
    background: var(--bg); border-radius: 10px;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  pre[hidden] { display: none; }
  .found { display: grid; gap: 8px; margin-top: 10px; }
  .found button {
    min-height: 44px; padding: 8px 12px; text-align: left;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .found small { color: var(--muted); }
  .btn[disabled] { opacity: .6; cursor: progress; }

  h2 { margin: 0 0 8px; font-size: 15px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid; grid-template-columns: 64px 76px minmax(0, 1fr); gap: 8px;
    min-height: 28px; align-items: center; font-size: 12px;
  }
  li .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  li .name { font-weight: 600; }
  li[data-ok="true"] .result { color: var(--ok); }
  li[data-ok="false"] .result { color: var(--warn); }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>
<body>

<nav class="tabs" role="tablist" aria-label="Seções do controle">

    Controle

    Números
  </button>

<dialog class="sheet" id="settings" aria-labelledby="settingsTitle">
  <div class="sheet-body">
    <div class="sheet-head">
      <h2 id="settingsTitle">Conexão</h2>
      <button class="iconbtn dark" id="closeSettings" type="button" aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <button class="btn" id="discover" type="button">Buscar TV na rede</button>
    <div class="found" id="found"></div>
    <p class="hint" id="discoverMsg" hidden></p>
    <div class="fields">
      <label>IP da TV
        <input id="ip" inputmode="decimal" autocomplete="off" placeholder="192.168.0.50">
      </label>
      <label>Chave PSK
        <input id="psk" autocomplete="off" placeholder="0000">
      </label>
    </div>
    <button class="btn" id="probe" type="button">Testar conexão</button>
    <pre id="probeOut" hidden></pre>
    <p class="hint">Na TV: Configurações &gt; Rede &gt; Controle IP, com autenticação "Normal e Pre-Shared Key" e a mesma chave acima.</p>

    <h2 class="log-title" id="logTitle">Últimos comandos</h2>
    <p class="empty" id="empty">Aperte uma tecla para ver o retorno da TV.</p>
    <ul id="log" aria-labelledby="logTitle"></ul>
  </div>
</dialog>

<script>
  const ipInput = document.getElementById('ip');
  const pskInput = document.getElementById('psk');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const logEl = document.getElementById('log');
  const emptyEl = document.getElementById('empty');
  const probeOut = document.getElementById('probeOut');
  const settings = document.getElementById('settings');
  const STORAGE_KEY = 'sonyremote.settings';
  const LOG_LIMIT = 8;

  // Load and persist connection settings (storage can be unavailable)
  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      ipInput.value = saved.ip || '';
      pskInput.value = saved.psk || '0000';
    } catch (err) {
      pskInput.value = '0000';
    }
  }
  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ip: ipInput.value.trim(), psk: pskInput.value.trim() }));
    } catch (err) { /* ignore */ }
  }
  ipInput.addEventListener('input', saveSettings);
  pskInput.addEventListener('input', saveSettings);

  function setStatus(text, tone) {
    statusText.textContent = text;
    statusEl.dataset.tone = tone;
  }

  async function callApi(path, extra) {
    const response = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ ip: ipInput.value.trim(), psk: pskInput.value.trim() }, extra))
    });
    return response.json();
  }

  function addLog(key, result, elapsedMs) {
    emptyEl.hidden = true;
    const row = document.createElement('li');
    row.dataset.ok = String(Boolean(result.ok));

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('pt-BR');

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = key;

    const outcome = document.createElement('span');
    outcome.className = 'result';
    outcome.textContent = result.ok
      ? 'OK · ' + elapsedMs + ' ms'
      : 'Falhou · ' + (result.status === null || result.status === undefined ? 'sem resposta' : 'HTTP ' + result.status);

    row.append(time, name, outcome);
    logEl.prepend(row);
    while (logEl.children.length > LOG_LIMIT) logEl.lastChild.remove();
  }

  async function sendKey(key) {
    if (!ipInput.value.trim()) {
      setStatus('Defina o IP da TV na engrenagem', 'warn');
      openSettings();
      return;
    }
    if (navigator.vibrate) navigator.vibrate(10);
    const started = performance.now();
    let result;
    try {
      result = await callApi('/api/send', { key: key });
    } catch (err) {
      result = { ok: false, status: null, body: 'servidor local indisponível' };
    }
    addLog(key, result, Math.round(performance.now() - started));
    if (result.ok) {
      setStatus('Conectado · ' + ipInput.value.trim(), 'ok');
    } else if (result.status === 403) {
      setStatus('TV recusou (403): confira a chave PSK na engrenagem.', 'error');
    } else {
      setStatus('Sem resposta da TV. Abra a engrenagem e teste a conexão.', 'error');
    }
  }

  // Keys: tap = one press; arrows, volume and channel repeat while held
  const REPEAT_DELAY_MS = 450;
  const REPEAT_INTERVAL_MS = 160;
  let holdTimer = null;
  let holdInterval = null;

  function stopHold() {
    clearTimeout(holdTimer);
    clearInterval(holdInterval);
    holdTimer = holdInterval = null;
  }

  document.querySelectorAll('[data-key]').forEach(function (button) {
    const key = button.dataset.key;
    if (button.hasAttribute('data-repeat')) {
      button.addEventListener('pointerdown', function () {
        sendKey(key);
        holdTimer = setTimeout(function () {
          holdInterval = setInterval(function () { sendKey(key); }, REPEAT_INTERVAL_MS);
        }, REPEAT_DELAY_MS);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (type) {
        button.addEventListener(type, stopHold);
      });
      // Keyboard activation (Enter/Space) arrives as a click with detail 0
      button.addEventListener('click', function (event) {
        if (event.detail === 0) sendKey(key);
      });
    } else {
      button.addEventListener('click', function () { sendKey(key); });
    }
  });

  document.getElementById('probe').addEventListener('click', async function () {
    if (!ipInput.value.trim()) { ipInput.focus(); return; }
    probeOut.hidden = false;
    probeOut.textContent = 'Testando...';
    try {
      const data = await callApi('/api/probe', {});
      if (!data.results) { probeOut.textContent = data.body || 'Erro desconhecido'; return; }
      probeOut.textContent = data.results.map(function (item) {
        const status = item.status === null ? 'sem resposta' : 'HTTP ' + item.status;
        return item.name + '\n' + item.url + '\n=> ' + status + '\n' + (item.body || '').slice(0, 200);
      }).join('\n\n');
    } catch (err) {
      probeOut.textContent = 'Servidor local indisponível: rode python server.py';
    }
  });

  // Auto-discovery: asks the local bridge to find Sony TVs on the Wi-Fi
  const discoverBtn = document.getElementById('discover');
  const foundEl = document.getElementById('found');
  const discoverMsg = document.getElementById('discoverMsg');

  function chooseDevice(device) {
    ipInput.value = device.ip;
    saveSettings();
    foundEl.replaceChildren();
    discoverMsg.hidden = true;
    setStatus('TV encontrada: ' + device.name + ' (' + device.ip + ')', 'ok');
  }

  async function discover() {
    discoverBtn.disabled = true;
    discoverBtn.textContent = 'Buscando...';
    foundEl.replaceChildren();
    discoverMsg.hidden = true;
    setStatus('Procurando a TV na rede...', 'warn');
    try {
      const response = await fetch('/api/discover', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      });
      const data = await response.json();
      const devices = data.devices || [];
      if (devices.length === 1) {
        chooseDevice(devices[0]);
      } else if (devices.length > 1) {
        setStatus('Escolha a TV na lista', 'warn');
        devices.forEach(function (device) {
          const option = document.createElement('button');
          option.type = 'button';
          const title = document.createElement('span');
          title.textContent = device.name + (device.model ? ' · ' + device.model : '');
          const detail = document.createElement('small');
          detail.textContent = device.ip;
          option.append(title, detail);
          option.addEventListener('click', function () { chooseDevice(device); });
          foundEl.append(option);
        });
      } else {
        setStatus('TV não encontrada', 'error');
        openSettings();
        discoverMsg.hidden = false;
        discoverMsg.textContent = data.localIp && data.localIp.indexOf('127.') === 0
          ? 'O aparelho que roda o servidor não parece estar em uma rede Wi-Fi.'
          : 'Nenhuma TV Sony respondeu. Confira se a TV está ligada, no mesmo Wi-Fi, e digite o IP manualmente se precisar.';
      }
    } catch (err) {
      setStatus('Servidor local indisponível', 'error');
    } finally {
      discoverBtn.disabled = false;
      discoverBtn.textContent = 'Buscar TV na rede';
    }
  }

  discoverBtn.addEventListener('click', discover);

  // Bottom tabs switch between the remote and the number pad
  const tabButtons = document.querySelectorAll('.tabs [role="tab"]');
  function selectTab(name) {
    tabButtons.forEach(function (button) {
      button.setAttribute('aria-selected', String(button.dataset.tab === name));
    });
    document.querySelectorAll('.tab').forEach(function (panel) {
      panel.hidden = panel.id !== 'tab-' + name;
    });
  }
  tabButtons.forEach(function (button) {
    button.addEventListener('click', function () { selectTab(button.dataset.tab); });
  });

  // Connection and command history live in a sheet opened by the gear
  function openSettings() {
    if (!settings.open) settings.showModal();
  }
  document.getElementById('openSettings').addEventListener('click', openSettings);
  document.getElementById('closeSettings').addEventListener('click', function () { settings.close(); });
  // A click on the backdrop targets the dialog itself (the body fills the rest)
  settings.addEventListener('click', function (event) {
    if (event.target === settings) settings.close();
  });

  loadSettings();
  if (!ipInput.value.trim()) discover();
</script>
</body>
</html>
